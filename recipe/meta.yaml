{% set name = "h3spark" %}
{% set version = "0.5.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/h3spark-{{ version }}.tar.gz
  sha256: c186f227c252d0f6641399b04f872dbb426a85eb24356b529745e61438c4b341

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - h3-py >=4.1
    - pyspark >=3.5,<5
    # pyarrow 26 needs numpy 2, which pyspark 3.5 doesn't support
    - pyarrow <26
    # pyspark 3.5 imports distutils, removed in Python 3.12
    - setuptools

test:
  imports:
    - h3spark
    - h3spark.native
    - h3spark.udf
    - h3spark.hex
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  dev_url: https://github.com/JosephChotard/h3spark
  home: https://github.com/JosephChotard/h3spark
  license_file: LICENSE
  license: MIT
  summary: "H3 for PySpark: Uber's H3 hexagonal geospatial index as fast native Spark SQL functions"

extra:
  recipe-maintainers:
    - JosephChotard
